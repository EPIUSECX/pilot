name: Desktop release (signed)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Create a draft GitHub release from this build
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  signed-build:
    name: Developer ID signed and notarized build
    permissions:
      contents: write
    runs-on: macos-14
    timeout-minutes: 90
    environment: desktop-release
    defaults:
      run:
        working-directory: desktop
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Record runner
        run: |
          uname -m
          sw_vers
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri:build
      - name: Verify signature and notarization
        run: |
          app=$(ls -d src-tauri/target/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-desktop-signed-${{ runner.arch }}
          path: |
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
      - name: Name the files
        if: ${{ inputs.publish }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p release
          cp src-tauri/target/release/bundle/dmg/*.dmg "release/Pilot-Desktop_${VERSION}_aarch64.dmg"
          ditto -c -k --keepParent src-tauri/target/release/bundle/macos/*.app "release/Pilot-Desktop_${VERSION}_aarch64.app.zip"
          (cd release && shasum -a 256 * > SHA256SUMS)
      - name: Publish a draft release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "desktop-v${VERSION}" release/* \
            --target "$GITHUB_SHA" --draft --generate-notes \
            --title "Pilot Desktop ${VERSION}"
