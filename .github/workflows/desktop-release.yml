name: Desktop release (signed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-build:
    name: Developer ID signed and notarized build
    runs-on: macos-14
    timeout-minutes: 90
    environment: desktop-release
    defaults:
      run:
        working-directory: desktop
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Record runner
        run: |
          uname -m
          sw_vers
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri:build
      - name: Verify signature and notarization
        run: |
          app=$(ls -d src-tauri/target/release/bundle/macos/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: pilot-desktop-signed-${{ runner.arch }}
          path: |
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
