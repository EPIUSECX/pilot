[package]
name = "pilot-desktop"
version = "0.2.0"
description = "Desktop companion for Frappe Pilot"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.80"

[lib]
name = "pilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
libc = "0.2"
ureq = { version = "3", default-features = false }
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test", "tray-icon", "image-png"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
